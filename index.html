<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header class="encabezado">
        <h1 class="texto-header">Controla tus ingresos y gastos fácilmente.</h1>
        <p class="texto-header">¡Bienvenido al mejor gestor de gastos del sistema!</p> 
        <p class="texto-header">¡Aquí podrás controlar tus ingresos y gastos de forma efectiva y sin confusiones!</p>
    </header>

     <section class="seccion-principal">
    <h2 class="titulo-resumen">Resumen</h2>

    <div class="caja-principal">
        <div class="tarjeta-ingresos">
            <h3>Ingresos</h3>
            <p class="valor" id="total-ingresos">$0</p>
        </div>

        <div class="tarjeta-gastos">
            <h3>Gastos</h3>
            <p class="valor" id="total-gastos">$0</p>
        </div>

        <div class="tarjeta-saldo">
            <h3>Saldo</h3>
            <p class="valor" id="total-saldo">$0</p>
        </div>
    </div>
</section> 
<section class="seccion-principal">
  <h2 class="titulo-resumen">Agregar Movimiento</h2>
  <div class="caja-principal">
<form>
    <input type="text" id="descripcion" placeholder="Descripción" required>
    <select id="tipo">
        <option value="ingreso">Ingreso</option>
        <option value="gasto">Gasto</option>
    </select>
    <input type="number" placeholder="Monto" required>
    <button type="submit">Agregar</button>
</form>
    </div>
</section>
</body>
</html>
